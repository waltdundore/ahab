---
# ==============================================================================
# DEPRECATED: Use deploy-service.yml (or Docker Compose) instead
# ==============================================================================
# This playbook is deprecated and will be removed in a future release.
#
# Why deprecated:
#   - Duplicated role logic that now lives in the apache/mysql/php roles
#   - Confusing to have multiple playbooks doing the same thing
#
# Migration (each service deploys through its role):
#   OLD: ansible-playbook -i inventory/dev/hosts.yml playbooks/lamp.yml
#   NEW (per service): ansible-playbook -i inventory/dev/hosts.yml \
#         playbooks/deploy-service.yml -e service=<apache|mysql|php>
#
# For development (faster):
#   Use: make install apache php (Docker Compose)
#
# This file fails with migration instructions for backward compatibility.
# ==============================================================================

- name: Redirect to deploy-service.yml
  hosts: webservers
  gather_facts: false

  tasks:
    - name: Display deprecation warning
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "⚠️  DEPRECATION WARNING"
          - "=========================================="
          - "This playbook (lamp.yml) is deprecated."
          - ""
          - "Use instead (one command per service):"
          - "  ansible-playbook -i inventory/dev/hosts.yml playbooks/deploy-service.yml -e service=apache"
          - "  ansible-playbook -i inventory/dev/hosts.yml playbooks/deploy-service.yml -e service=mysql"
          - "  ansible-playbook -i inventory/dev/hosts.yml playbooks/deploy-service.yml -e service=php"
          - ""
          - "Or for development:"
          - "  make install apache php"
          - "=========================================="

    - name: Fail with migration instructions
      ansible.builtin.fail:
        msg: |
          This playbook is deprecated. Please update your commands:

          OLD: ansible-playbook -i inventory/dev/hosts.yml playbooks/lamp.yml
          NEW (per service): ansible-playbook -i inventory/dev/hosts.yml \
                playbooks/deploy-service.yml -e service=<apache|mysql|php>

          Or use: make install apache php
