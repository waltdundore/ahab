---
# ==============================================================================
# Ahab Module Registry
# ==============================================================================
# Truth-rewritten 2026-09-11 per BLUEPRINT.md D-17 + SPEC.md §3.0/§3.1 and the
# 2026-09-10 git-estate full probe (BLUEPRINT "Live-probed facts").
#
# Design: modules are DIRECTORIES inside ahab (modules/<name>/module.yml),
# never per-module GitHub repos. The 2024 repo-per-module design is retired:
# the estate probe found 8 of 9 named `ahab-module-*` repos never existed.
#
# Entry keys:
#   - path:        module directory inside ahab (modules/<name>/module.yml)
#   - description / deployment / dependencies / platforms / tags: carried over
#   - status:      stable | beta | alpha | planned | deprecated
#     `planned` = no module.yml exists on disk yet; catalog intent only.
#
# Removed entries (2026-09-11 estate-hygiene pass, evidence
# evidence/2026-09-11-estate-hygiene.md):
#   - docker: `ahab-module-docker` exists but is a stale copy of
#     ahab-module-common shipping no docker role — retired per D-17; a real
#     `modules/docker/` will be authored per SPEC §3.1 when built.
#   - the 8 phantom repo entries (apache, php, mysql, postgresql, nginx,
#     redis, wordpress, nextcloud) had their repository/documentation URLs
#     stripped per SPEC §3.0 disposition "delete from MODULE_REGISTRY.yml";
#     their module intent survives below ONLY as status: planned with a
#     directory path (no phantom repo is referenced anywhere in this file).
#   - apache note: a real apache module.yml exists in the `ahab-modules`
#     repo, to be absorbed into modules/apache/ per SPEC §3.0 — until it
#     lands on disk here its status is honestly `planned`, not `stable`.

registry:
  version: "2.0"
  updated: "2026-09-12"
  layout: "modules/<name>/module.yml"  # SPEC §3.1 directory-based modules

  modules:
    # bootstrap/docker/platform are IMPLEMENTED on disk (modules/<name>/module.yml
    # exists — M1 plug-in socket, 2026-09-12); status experimental until the
    # vagrant gate proves them (B-017). Entries below remain catalog intent
    # (status: planned) with no directory on disk yet.
    bootstrap:
      path: "modules/bootstrap"
      description: "Layer-0 bootstrap - system baseline + ansible_user service account"
      deployment: [ansible]
      dependencies: []
      status: experimental
      platforms: [fedora]
      tags: [bootstrap, l0, baseline, service-account]
      maintainer: "Ahab Project"

    docker:
      path: "modules/docker"
      description: "Docker (Moby) engine + compose v2 plugin"
      deployment: [ansible]
      dependencies: [bootstrap]
      status: experimental
      platforms: [fedora]
      tags: [docker, container, compose]
      maintainer: "Ahab Project"

    platform:
      path: "modules/platform"
      description: "Site service-stack launcher (compose stack + health gates)"
      deployment: [ansible]
      dependencies: [docker]
      status: experimental
      platforms: [fedora]
      tags: [platform, compose, stack]
      maintainer: "Ahab Project"

    apache:
      path: "modules/apache"
      description: "Apache HTTP Server - Industry-standard web server"
      deployment: [ansible, docker]
      dependencies: []
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [webserver, http, apache]
      maintainer: "Ahab Project"

    php:
      path: "modules/php"
      description: "PHP - Server-side scripting language"
      deployment: [ansible, docker]
      dependencies: [apache]
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [php, scripting, web]
      maintainer: "Ahab Project"

    mysql:
      path: "modules/mysql"
      description: "MySQL - Relational database server"
      deployment: [ansible, docker]
      dependencies: []
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [database, mysql, sql]
      maintainer: "Ahab Project"

    postgresql:
      path: "modules/postgresql"
      description: "PostgreSQL - Advanced relational database"
      deployment: [ansible, docker]
      dependencies: []
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [database, postgresql, sql]
      maintainer: "Ahab Project"

    nginx:
      path: "modules/nginx"
      description: "Nginx - High-performance web server and reverse proxy"
      deployment: [ansible, docker]
      dependencies: []
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [webserver, nginx, proxy]
      maintainer: "Ahab Project"

    redis:
      path: "modules/redis"
      description: "Redis - In-memory data structure store"
      deployment: [ansible, docker]
      dependencies: []
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [cache, redis, database]
      maintainer: "Ahab Project"

    wordpress:
      path: "modules/wordpress"
      description: "WordPress - Content management system"
      deployment: [ansible, docker]
      dependencies: [apache, php, mysql]
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [cms, wordpress, web]
      maintainer: "Ahab Project"

    nextcloud:
      path: "modules/nextcloud"
      description: "Nextcloud - Self-hosted file sharing and collaboration"
      deployment: [ansible, docker]
      dependencies: [apache, php, mysql]
      status: planned
      platforms: [fedora, debian, ubuntu]
      tags: [cloud, storage, collaboration]
      maintainer: "Ahab Project"

# Module status values:
#   - stable: Production-ready, fully tested (requires modules/<name>/module.yml on disk)
#   - experimental: implemented on disk, not yet proven by the vagrant gate
#     (module.yml `status:` vocabulary per SPEC §3.1)
#   - beta: Feature-complete, testing in progress
#   - alpha: Under active development
#   - planned: Not yet implemented (no directory on disk; catalog intent only)
#   - deprecated: No longer maintained
