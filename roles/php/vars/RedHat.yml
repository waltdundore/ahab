---
# PHP variables for RedHat family (Fedora, RHEL, CentOS)

php_packages:
  - php
  - php-cli
  - php-common
  - php-fpm
  - php-mysqlnd
  - php-pdo
  - php-gd
  - php-mbstring
  - php-xml
  - php-json

php_extensions: []
php_ini_file: /etc/php.ini
php_fpm_conf: /etc/php-fpm.conf
php_fpm_pool_dir: /etc/php-fpm.d

# Cross-role vars: this role configures Apache for PHP integration (intentional)
apache_service: httpd # noqa: var-naming[no-role-prefix]
apache_user: apache # noqa: var-naming[no-role-prefix]
apache_group: apache # noqa: var-naming[no-role-prefix]
apache_document_root: /var/www/html # noqa: var-naming[no-role-prefix]
apache_check_command: "systemctl is-active httpd" # noqa: var-naming[no-role-prefix]
