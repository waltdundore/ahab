---
# PHP variables for Debian family (Debian, Ubuntu)

php_packages:
  - php
  - php-cli
  - php-common
  - php-fpm
  - php-mysql
  - php-gd
  - php-mbstring
  - php-xml
  - php-curl
  - libapache2-mod-php

php_extensions: []
php_ini_file: /etc/php/8.2/apache2/php.ini
php_fpm_conf: /etc/php/8.2/fpm/php-fpm.conf
php_fpm_pool_dir: /etc/php/8.2/fpm/pool.d

# Cross-role vars: this role configures Apache for PHP integration (intentional)
apache_service: apache2 # noqa: var-naming[no-role-prefix]
apache_user: www-data # noqa: var-naming[no-role-prefix]
apache_group: www-data # noqa: var-naming[no-role-prefix]
apache_document_root: /var/www/html # noqa: var-naming[no-role-prefix]
apache_check_command: "systemctl is-active apache2" # noqa: var-naming[no-role-prefix]
