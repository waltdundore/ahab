---
# PHP role metadata

galaxy_info:
  author: Ahab Project
  description: PHP installation and configuration with Apache integration
  license: MIT
  min_ansible_version: "2.9"

  platforms:
    - name: Fedora
      versions:
        - "38"
        - "39"
    - name: EL
      versions:
        - "8"
        - "9"
    # Debian/Ubuntu use codenames per the Galaxy meta schema (not version numbers)
    - name: Debian
      versions:
        - "bullseye"   # 11
        - "bookworm"   # 12
    - name: Ubuntu
      versions:
        - "focal"      # 20.04
        - "jammy"      # 22.04

  galaxy_tags:
    - php
    - web
    - development
    - scripting

dependencies:
  - role: apache
    when: apache_check.rc != 0
